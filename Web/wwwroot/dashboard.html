<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · FS-Flights</title>
    <link rel="icon" href="data:," />
    <!-- Tailwind v4 browser build: compiles classes in the page at runtime. Good for Phase One;
         switch to a build step before the UI grows, since the CDN build isn't meant for production. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <main class="mx-auto max-w-3xl px-4 py-6 sm:px-6 sm:py-12">
        <header class="mb-6 flex flex-wrap items-center justify-between gap-x-4 gap-y-3 sm:mb-8">
            <div>
                <h1 class="text-2xl font-semibold tracking-tight">FS-Flights</h1>
                <!-- Relative links, so the site still works as an IIS sub-application. -->
                <nav class="mt-1 flex gap-4 text-sm">
                    <a href="./" class="text-slate-400 hover:text-slate-200">Profile</a>
                    <a href="flights.html" class="text-slate-400 hover:text-slate-200">Flights</a>
                    <a href="dashboard.html" aria-current="page" class="font-medium text-sky-400">Dashboard</a>
                </nav>
            </div>
            <!-- Sign-in area, driven by js/auth.js. Shows Google's button or the signed-in user. -->
            <div id="auth-area" class="flex min-h-10 items-center gap-3">
                <span id="auth-loading" class="text-sm text-slate-500">…</span>

                <div id="auth-signed-out" hidden class="flex flex-col items-end gap-1">
                    <div id="google-button"></div>
                    <p id="auth-error" hidden class="max-w-xs text-right text-xs text-rose-400" role="alert"></p>
                </div>

                <div id="auth-signed-in" hidden class="flex items-center gap-2 sm:gap-3">
                    <img id="auth-avatar" hidden alt="" referrerpolicy="no-referrer"
                         class="h-9 w-9 rounded-full border border-slate-700 object-cover" />
                    <!-- Name and email only on wider screens; phones show just the avatar. -->
                    <div class="hidden text-right leading-tight sm:block">
                        <div id="auth-name" class="text-sm font-medium"></div>
                        <div id="auth-email" class="text-xs text-slate-400"></div>
                    </div>
                    <button id="sign-out" type="button"
                            class="rounded-lg border border-slate-700 px-2.5 py-1 text-xs text-slate-300 hover:bg-slate-800 sm:px-3 sm:py-1.5 sm:text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400">
                        Sign out
                    </button>
                </div>
            </div>
        </header>

        <div class="mb-3 flex items-center justify-between gap-4">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">System status</h2>
            <button id="refresh"
                    class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-medium hover:bg-sky-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 disabled:opacity-50">
                Refresh
            </button>
        </div>

        <!-- Overall banner, updated by js/dashboard.js -->
        <section id="banner" class="mb-6 rounded-xl border border-slate-700 bg-slate-900 p-5" aria-live="polite">
            <div class="flex items-center gap-3">
                <span id="banner-dot" class="h-3 w-3 rounded-full bg-slate-500"></span>
                <span id="banner-text" class="font-medium">Contacting backend…</span>
            </div>
            <p id="banner-detail" class="mt-2 text-sm text-slate-400"></p>
        </section>

        <div class="grid gap-6 sm:grid-cols-2">
            <section class="rounded-xl border border-slate-800 bg-slate-900 p-5">
                <h2 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-400">Backend</h2>
                <dl id="app-info" class="space-y-2 text-sm"></dl>
            </section>
            <section class="rounded-xl border border-slate-800 bg-slate-900 p-5">
                <h2 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-400">Database</h2>
                <dl id="db-info" class="space-y-2 text-sm"></dl>
            </section>
        </div>

        <details class="mt-6 rounded-xl border border-slate-800 bg-slate-900 p-5 text-sm">
            <summary class="cursor-pointer text-slate-400">Raw response</summary>
            <pre id="raw" class="mt-3 overflow-x-auto text-xs text-slate-300"></pre>
        </details>
    </main>

    <script src="js/dashboard.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
